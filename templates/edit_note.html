<!DOCTYPE html>
<html>
<head>
    <title>Edit Note</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="mb-4">Edit Note</h1>

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">
            <label>Title</label>
            <input
                type="text"
                name="title"
                class="form-control"
                value="{{ note.title }}">
        </div>

        <div class="mb-3">
            <label>Subject</label>
            <input
                type="text"
                name="subject"
                class="form-control"
                value="{{ note.subject }}">
        </div>

        <div class="mb-3">
            <label>Semester</label>
            <input
                type="number"
                name="semester"
                class="form-control"
                value="{{ note.semester }}">
        </div>

        <div class="mb-3">
            <label>Description</label>

            <textarea
                name="description"
                class="form-control"
                rows="5">{{ note.description }}</textarea>
        </div>

        <button type="submit"
                class="btn btn-warning">
            Update Note
        </button>

    </form>

</div>

</body>
</html>
